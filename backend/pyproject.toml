[project]
name = "echoes-of-verse-backend"
version = "0.5.0"
description = "Shuidiaogetou offline content tooling and read-only catalog"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "SQLAlchemy>=2.0,<3",
    "psycopg[binary]>=3.2,<4",
    "alembic>=1.14,<2",
    "redis>=5,<7",
    "httpx>=0.27,<1",
    "jieba>=0.42.1,<1",
]

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.27,<1"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
